# dabberz control-plane configuration.
#
# Copy to configs/dabberz.yaml and edit. Credentials are deliberately absent:
# supply them through the environment so this file stays safe to read and to
# check in.
#
#   DABBERZ_MASTER_KEY            secrets key (generate with `dabberzctl keygen`)
#   DABBERZ_ORCHESTRATOR_API_KEY  the planning model's API key
#   CLAUDE_CODE_OAUTH_TOKEN       the coding agent's token

# The owner. With auth.kind "single" this is the one person every request is
# attributed to; with a provider it is the account the first sign-in adopts, so
# an installation that started single-user keeps its history.
owner: you@example.com

# How requests are identified.
#
# There is no default. A deployment that forgot to configure this fails to
# start rather than coming up open, because this process hands out a shell on
# its machine, a secrets vault and the whole audit trail.
#
#   clerk   verify session tokens from a Clerk instance. Only the publishable
#           key is needed to verify: it encodes the instance host, which is
#           where the issuer and signing keys are read from. The secret key is
#           used solely to look up a new user's email address for attribution.
#   single  treat every request as `owner` without asking for anything. For a
#           daemon on a loopback address and nowhere else.
auth:
  kind: clerk
  clerk:
    # Replace with your instance's key. It is not a credential -- it is sent
    # to the browser -- but CLERK_PUBLISHABLE_KEY overrides it, so one place
    # can configure both keys.
    publishable_key: pk_test_eW91ci1pbnN0YW5jZS5jbGVyay5hY2NvdW50cy5kZXYk
    # Leave empty and set CLERK_SECRET_KEY. Verification does not need it; it
    # is used only to look up a new user's email for attribution.
    secret_key: ""
    # Restricts which origins' tokens are accepted, which matters when one
    # provider instance serves several applications. Only a token minted by a
    # browser carries the claim this checks, so leave it empty if you also mint
    # tokens through the provider's backend API.
    authorized_parties: []

# Database, VM workspaces and the per-repo memory store.
data_dir: var

server:
  addr: 127.0.0.1:8080
  read_timeout: 30s
  # No write timeout: the activity feed is a long-lived streaming response.
  write_timeout: 0s

driver:
  # "firecracker" in production. Containers are not an option: agents need full
  # access to their own environment and need to drive a real browser.
  # "local" runs agents on the host with no isolation -- development only.
  kind: firecracker
  image: dabberz-golden
  # What each fork VM gets.
  fork_resources:
    vcpus: 4
    memory_mib: 8192
    disk_gib: 40

  firecracker:
    kernel_image: /srv/dabberz/vmlinux
    # One generic golden image with the whole toolchain (Go, Rust, Node, the
    # common databases, the browser stack), rather than one image per
    # toolchain. Each VM boots a copy-on-write overlay of it.
    golden_rootfs: /srv/dabberz/golden.ext4
    chroot_base: /srv/dabberz/vm
    bridge_name: fcbr0
    network: 172.30.0.0/16
    ssh_port_base: 22000
    # Held back from the machine's totals so the control plane, the proxy and
    # the UI VM are never squeezed out by fork VMs.
    host_reserve:
      vcpus: 4
      memory_mib: 8192
      disk_gib: 100

  local:
    total:
      vcpus: 8
      memory_mib: 16384
      disk_gib: 200

scheduler:
  interval: 5s
  # Keep the queue strictly first-come-first-served. Running forks are never
  # pre-empted either way; this only decides whether a large fork can be
  # overtaken by smaller ones behind it.
  head_of_line_blocking: true

preview:
  # Every exposed service of every fork gets its own hostname under this
  # domain. No deploys, no cache clears: the user and the verifier open the
  # same in-flight preview.
  #
  # This is deliberately NOT the domain the control plane is on. The control
  # plane has a shell behind it and must be locked down; previews must not be,
  # because the verifier's browser would otherwise need a credential and
  # because a preview you cannot send to someone is not serving its purpose.
  # Separate hostname spaces are what let one be closed and the other open.
  domain: ondabberz.link
  scheme: https
  port_start: 41000
  port_end: 42999

  # Where allocated routes get published.
  #
  #   inprocess  dabberzd answers preview hostnames itself. Correct when a CDN
  #              fronts the preview zone and terminates TLS, which is the
  #              usual case: the origin then never needs a certificate at all.
  #              It answers over plain HTTP, so it must not be exposed
  #              directly to the internet.
  #   caddy      configures an external Caddy over its admin API. Needed when
  #              TLS has to terminate on this machine, because a wildcard
  #              certificate can only be issued over DNS-01 and Caddy is what
  #              does that. Fill in the caddy section below.
  #   none       allocate and display hostnames but publish nowhere.
  #
  # Left empty this is inferred from whether caddy.wildcard_domain is set, and
  # the choice is logged at startup.
  router: inprocess

# Only needed when preview.router is "caddy". Serving previews in-process
# needs none of this.
caddy:
  admin_endpoint: http://127.0.0.1:2019
  server_name: dabberz
  listen: [":443"]
  # Empty means no Caddy. Set this to the preview domain to use it.
  wildcard_domain: ""
  acme_email: you@example.com
  # A wildcard certificate can only be issued over DNS-01, which is what lets a
  # new fork be reachable immediately instead of waiting on issuance.
  dns_provider:
    name: cloudflare
    api_token: "{env.CF_API_TOKEN}"
  # Requests for hostnames no fork claims land here, so a stale preview link
  # gets a real page instead of a TLS failure.
  fallback_upstream: 127.0.0.1:8080

llm:
  # The orchestrator model is pluggable behind an OpenAI-shaped API.
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  timeout: 120s
  max_retries: 3

agent:
  binary: claude
  # The dabberz MCP toolset: secrets, preview control, browser driving.
  mcp_config: /etc/dabberz/mcp.json
  timeout: 45m
  # Where the agent keeps its conversations inside the VM. Resuming reads them
  # back from here, so it has to outlive a restart: on a rebuilt machine the
  # default home directory is gone, and the only symptom is a resume quietly
  # starting fresh -- which is what resuming exists to avoid.
  session_dir: /workspace/.dabberz/agent

verify:
  # One shared UI VM serves every verifier: a single browser with N
  # independently addressable profiles, not N browsers. Leave ui_instance_id
  # empty to have one provisioned automatically; set it to pin an existing
  # instance instead.
  ui_instance_id: ""
  profiles: 4
  vm:
    auto_provision: true
    name: dabberz-ui
    # A browser driving several profiles wants memory more than vCPUs.
    resources:
      vcpus: 2
      memory_mib: 8192
      disk_gib: 20
  driver_command: ["dabberz-verify"]
  timeout: 10m

merge:
  git_binary: git
  remote: origin
  push: true
  # Leave this off. It is what stops unreviewed work reaching a shared branch.
  skip_quality_gate: false

# Global escalation thresholds, not per-task. Crossing any of them pauses the
# fork and asks the user.
tripwire:
  max_cycles: 8
  max_tokens: 4000000
  max_cost_usd: 25
  max_wall_clock: 4h
