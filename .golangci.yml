version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - copyloopvar
    - misspell
    - nilerr
    - revive
    - unconvert
    - whitespace
  settings:
    errcheck:
      # Conventional cleanup and terminal-output calls whose errors are not
      # actionable: a failed Close on a read-only handle cannot be recovered
      # from, and a failed write to a client that has already gone leaves
      # nothing to do. Everything else stays checked.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Tearing down a socket or a terminal session: by the time these fail
        # the thing being closed is already gone, and there is no second
        # recovery step to take.
        - (*github.com/dabbers/devex/internal/api.wsConn).Close
        - (github.com/dabbers/devex/internal/vm.Session).Close
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          # A websocket test holds the upgraded connection open on purpose;
          # closing the response body would close the socket under test.
          - bodyclose

formatters:
  enable:
    - gofmt
