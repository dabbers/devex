version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - copyloopvar
    - misspell
    - nilerr
    - revive
    - unconvert
    - whitespace
  settings:
    errcheck:
      # Conventional cleanup and terminal-output calls whose errors are not
      # actionable: a failed Close on a read-only handle cannot be recovered
      # from, and a failed write to a client that has already gone leaves
      # nothing to do. Everything else stays checked.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
