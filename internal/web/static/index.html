<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dabberz</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>◆</text></svg>">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">dabberz</a>
    <nav class="tabs">
      <a href="#/" data-route="overview">Overview</a>
      <a href="#/activity" data-route="activity">Activity</a>
      <a href="#/repos" data-route="repos">Repos</a>
    </nav>
    <div class="status" id="status-strip" aria-live="polite"></div>
    <div class="conn" id="conn" title="Live connection"><span class="dot"></span><span id="conn-label">connecting</span></div>
  </header>

  <main id="view" class="view"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
